name: Implementation acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check component licenses
        run: npm run licenses
      - name: Verify SQLite capabilities
        run: npm run check:runtime
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Build and test local implementation
        run: npm run release:evidence -- --build --verify --e2e --out validation/implementation
      - name: Retain exact evidence and GUI artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vantage-implementation-windows
          path: |
            validation/implementation
            e2e/artifacts
            e2e/test-results
          retention-days: 30
