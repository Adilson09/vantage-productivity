name: Bug report
description: Report a reproducible problem in Vantage Productivity
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vantage Productivity. Search existing issues first.
        Reports are public. Remove confidential content, credentials and personal details.
        For vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options:
        - Documents / DOCX
        - Spreadsheets / XLSX or XLSM
        - Presentations / PPTX
        - PDF
        - Markdown
        - HTML
        - Calendar / contacts
        - Local records / SQLite
        - Search / inspection / recovery
        - Mail companion
        - AI / connected provider / privacy
        - Home / command line / build / packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vantage version or source commit
      placeholder: "0.15.0-dev.1 Windows ZIP, or full source commit"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 version/build, x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include file type and the exact sequence of actions.
      placeholder: |
        1. Open a sanitized copy of...
        2. Change...
        3. Save and reopen...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error text and whether it happens consistently.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized sample, screenshot or log
      description: Optional. Share the smallest example. Remove credentials, document secrets and personal details.
