name: Feature request
description: Explain a workflow Vantage Productivity should make easier
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Tell us the task and the outcome you want. Concrete examples help prioritize useful work.
        Search existing issues and add your comment if the same request is already open.
  - type: input
    id: tool
    attributes:
      label: Affected tool or workflow
      placeholder: 'For example, Sheets pivot refresh or local calendar import'
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today, and where does it fall short?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful result look like?
      description: Describe the behavior you need, with a small example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or relevant examples
      description: Optional. Do not attach confidential documents or account credentials.
