[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
default-run = "xlsx-sidecar"

[[bin]]
name = "vantage-query-worker"
path = "src/bin/vantage-query-worker.rs"
test = false

[features]
# Run indexing and recalc inline instead of on threads, as WebAssembly builds
# without threads must; lets that path be tested on any machine.
single-thread = []

[dependencies]
base64 = "0.22.1"
calamine = "0.37.0"
ironcalc = "0.7.1"
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native session journal is local-only. WebAssembly keeps the same core
# transaction API with an in-memory store and no SQLite/OS dependency.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
